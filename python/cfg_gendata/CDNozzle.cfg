// ============================================================================
// CDNozzle Python data-generation configuration
//
// This config creates mobile particles and boundary-marker particles.
// Boundary particles mark cells that contain wall segments.
//
// Coordinate convention:
//   x direction: preferred flow direction when flow_angle = 0.0
//   x min: inlet plane
//   x max: positive axial extent
//   y min/y max: lower and upper pipe walls
//   z: retained for 3D particle data and Vulkan cell indexingwe 
// ============================================================================

// Required: selects the generator family used by the front end.
type 				= "flow";

// Required: output directory for generated .bin, .tst, and .rpt files.
data_dir 			= "C:/_DJ/gPCDData/examples";

// Required: directory containing the Python generator module.
module_dir 			= "C:/_DJ/gPCD/python/gbase";

// Required: Python generator loaded by TabFormGenData.
module_class 		= "GenReservoir.py";

// Optional: when true, write only test/config files and skip binary rewrite.
test_files_only 	= false;

// Optional: when true, clear existing generated files before writing new files.
replace_all 		= true;

// Required for Python plotter: half-width of the plotted cell neighborhood.
cell_range 			= 4;

// Required for Python plotter: number of facets used to draw each sphere.
sphere_facets 		= 15;

// Required for Python plotter: inclusive particle index range to display.
particle_range 		= [1,500];

// Required for Python plotter: default RGB particle color.
particle_color 		= [1.0,0.0,0.0];

// Optional for Python plotter: draw particles as points instead of spheres.
as_points 				= true;
dynamics_diagnostics 	= false;

// Optional for Python plotter: vary color by particle/collision state.
vary_color				= true;
// Required: base name used for generated output files.
STUDY_NAME 				= "CDNozzle";
study 					= false;
dim 					= 2;
dimensions 				= 2;
contact_force_measure 	= "depth";
// Optional: draw the HSV diagnostic wheel in the Python simulation view.
plot_hsv_wheel			= false;

// Optional: draw particle numbers in the Python simulation view.
simulation_particle_numbers = false;

// Optional: Vulkan clear/background color for generated scene review.
clear_color = {red = 1.0; green = 1.0; blue = 1.0; alpha = 1.0;};

// Required: directory for Python dynamics reports and diagnostics.
run_debug_dir 				= "C:/_DJ/gPCDData/examples/rpt/CDNozzle";

// Optional: when true, stop the Python simulation on reported dynamics errors.
exit_on_error 				= false;

// Required: wall ghost offset as a fraction of particle radius.
wall_contact_offset 		= 0.0625;



// Required: Python simulation display frame rate.
frame_rate 					= 1000;

// Optional: open ForcePlots after the run when reports are available.
plot_report 				= false;


// Required: Python substeps per displayed frame.

// Required: enables wall processing in the Python dynamics model.
walls_on 					= true;

// Required: Python simulation window size in pixels.
window_size 				= (1000, 1000);

// LIVE: material table. Particles default to material_id 0 unless explicitly tagged.
material_properties = (
  {
    material_id 		= 0;
    name 				= "substance";
    relative_mass 		= 1.0;
    thermal_velocity 	= 0.0;
    color_mode 			= "VELOCITY_ANGLE";
    color_map 			= "HSV";
    point_size 			= 1.0;
    cell_density 		= 0.0;
  },
  {
    material_id 		= 1;
    name 				= "collision substance";
    relative_mass 		= 1.0;
    thermal_velocity 	= 0.0;
    color_mode 			= "COLLISION";
    color_map 			= "SOLID";
    collision_color 	= [1.0, 0.0, 0.0, 1.0];
    non_collision_color = [0.0, 1.0, 0.0, 1.0];
    point_size 			= 1.0;
    cell_density 		= 0.0;
  },
  {
    material_id 		= 3;
    name 				= "substance_color_lim";
    relative_mass 		= 1.0;
    thermal_velocity 	= 0.0;
    color_mode 			= "VELOCITY_ANGLE";
    color_map 			= "HSV";
    point_size 			= 1.0;
    cell_density 		= 0.0;
	capture_angle0 		= [0.0, 5.0, 5.0];

  },
  {
    material_id 		= 4;
    name 				= "substance_internal_energy";
    relative_mass 		= 1.0;
    thermal_velocity 	= 0.0;
    color_mode 			= "INTERNAL_MOMENTUM";
    color_map 			= "GRAY_LINEAR";
	start_mom			= 0.0;
	end_mom				= 0.25;
    point_size 			= 3.0;
    cell_density 		= 0.0;

  },
  {
    // Reflecting wall receiver. REFLECT accepts carried reflection-photon
    // payload and retires the courier photon.
    material_id 				= 5;
    name 						= "Boundary";
    color_mode 					= "SOLID";
    color 						= [0.0, 0.0, 0.0, 1.0];
    debug_visible 				= false;
    debug_color 				= [0.0, 1.0, 0.0, 1.0];
  }

);

// Required: cell occupancy list capacity written to the .tst file.
// Verified against particle radius and the maximum-penetration density bound.
// The generator derives and emits the required power-of-two capacity.
cell_occupancy_list_size	= 64;
duplicates_list_size		= 32;






